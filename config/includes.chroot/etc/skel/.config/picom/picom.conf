backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
inactive-opacity = 0.94;
frame-opacity = 0.88;
opacity-rule = [ "100:class_g = 'firefox'", "100:class_g = 'mpv'" ];
